services:
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8787"
    networks:
      - 9router-net

  9router:
    image: 9router-fork:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    volumes:
      - /home/amseify/.9router:/app/data
    networks:
      - 9router-net
    depends_on:
      - headroom

networks:
  9router-net:
    name: 9router-net
    driver: bridge
